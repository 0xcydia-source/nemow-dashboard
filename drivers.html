<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Nemow · Driver performance review</title>
<style>/* Nemow driver portal — self-contained styles (no network assets). */
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:#eef2f7;color:#1f2937;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto;padding:16px 12px 48px}
body.rtl{direction:rtl}
/* ---------------- login */
#gate{min-height:100vh;display:grid;place-items:center;padding:18px;
  
  background:linear-gradient(150deg,#0f3d5c,#12667f 55%,#0e7490)}
#gate .card{width:100%;max-width:400px;background:#fff;border-radius:18px;padding:26px 22px 22px;
  box-shadow:0 22px 60px rgba(4,26,38,.35);text-align:center}
#gate .logo{display:block;width:170px;max-width:64%;height:auto;margin:0 auto 6px}
#gate h1{font-size:20px;color:#0f3d5c;line-height:1.35}
#gate p{font-size:13px;color:#64748b;margin:6px 0 16px}
#gate label{display:block;text-align:start;font-size:12px;color:#475569;font-weight:600;margin-bottom:5px}
#gate input{width:100%;font-size:22px;letter-spacing:2px;text-align:center;direction:ltr;
  padding:12px 10px;border:1px solid #cbd8df;border-radius:12px;font-variant-numeric:tabular-nums}
#gate input:focus{outline:none;border-color:#0e7490;box-shadow:0 0 0 4px #0e749026}
#gate button{width:100%;margin-top:12px;min-height:50px;border:0;border-radius:12px;cursor:pointer;
  background:linear-gradient(135deg,#12505c,#0b7a72);color:#fff;font-size:16px;font-weight:700}
#gate .err{color:#b42338;font-size:13px;min-height:20px;margin-top:8px}
#gate .hint{font-size:11.5px;color:#94a3b8;margin-top:10px}
#gate .langs{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
#gate .langs button{width:auto;margin:0;min-height:36px;padding:6px 14px;font-size:13px;
  background:#eef6fb;color:#0f3d5c;border:1px solid #cbd8df;border-radius:999px;font-weight:600}
#gate .langs button[aria-pressed="true"]{background:#0f3d5c;color:#fff;border-color:#0f3d5c}
/* ---------------- shell */
header.hero{background:linear-gradient(135deg,#0f3d5c,#12667f 55%,#0e7490);color:#fff;
  border-radius:16px;padding:18px 18px 16px;box-shadow:0 10px 26px rgba(15,61,92,.22)}
.hero .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hero .id{font:700 13px ui-monospace,monospace;direction:ltr;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.24);padding:4px 10px;border-radius:999px;white-space:nowrap}
.hero h1{font-size:22px;line-height:1.3;font-weight:800;margin-top:8px}
.hero .say{font-size:13.5px;opacity:.94;margin-top:6px}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hero .meta span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);
  padding:3px 10px;border-radius:999px;font-size:11.5px}
.langs{display:flex;gap:6px;margin-top:12px}
.langs button{min-height:34px;padding:5px 13px;font:600 12.5px inherit;cursor:pointer;
  border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff}
.langs button[aria-pressed="true"]{background:#fff;color:#0f3d5c;border-color:#fff}
/* ---------------- sections */
h2{font-size:17px;margin:24px 0 8px;padding-inline-start:10px;border-inline-start:5px solid #0e7490;
  color:#0f3d5c;font-weight:800}
h2 .n{color:#94a3b8;margin-inline-end:6px}
.panel{background:#fff;border-radius:13px;padding:14px;box-shadow:0 3px 12px rgba(16,42,67,.08)}
.panel p{font-size:12.5px;color:#475569}
/* ---------------- headline number */
.hero2{background:#fff;border-radius:14px;padding:16px;box-shadow:0 3px 12px rgba(16,42,67,.08);
  border-inline-start:6px solid #dc2626;margin-top:14px}
.hero2.good{border-inline-start-color:#16a34a}
.hero2.mid{border-inline-start-color:#d97706}
.hero2 .big{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;color:#0f3d5c}
.hero2 .big small{font-size:15px;font-weight:600;color:#64748b;letter-spacing:0}
.hero2 .cmp{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.hero2 .cmp div{flex:1 1 130px;background:#f8fafc;border-radius:9px;padding:8px 10px}
.hero2 .cmp span{display:block;font-size:11px;color:#64748b}
.hero2 .cmp strong{font-size:17px;color:#0f3d5c}
/* ---------------- kpi tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin-top:12px}
.tile{background:#fff;border-radius:11px;padding:10px 11px;box-shadow:0 2px 9px rgba(16,42,67,.07);
  border-top:4px solid #0e7490}
.tile.r{border-top-color:#dc2626}.tile.a{border-top-color:#d97706}
.tile.g{border-top-color:#16a34a}.tile.b{border-top-color:#2563eb}
.tile span{display:block;font-size:10.5px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.tile strong{display:block;font-size:22px;font-weight:800;color:#0f3d5c;line-height:1.2}
.tile small{display:block;font-size:10.5px;color:#94a3b8}
/* ---------------- charts */
.chart{background:#fff;border-radius:13px;padding:12px;box-shadow:0 3px 12px rgba(16,42,67,.08);margin-top:10px;
  overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart svg{width:100%;height:auto;display:block}
.chart .swipe{display:none;font-size:10.5px;color:#94a3b8;margin-bottom:4px}
.chart .cap{font-size:11.5px;color:#64748b;margin-top:6px}
/* ---------------- excuse killers */
.claim{display:grid;gap:10px;margin-top:10px}
.card2{background:#fff;border-radius:12px;padding:12px 13px;box-shadow:0 3px 12px rgba(16,42,67,.08);
  border-inline-start:5px solid #16a34a}
.card2 .q{font-size:13.5px;font-weight:800;color:#0f3d5c}
.card2 .v{display:inline-block;margin-top:5px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;background:#16a34a}
.card2 .v.no{background:#dc2626}.card2 .v.part{background:#d97706}
.card2 .e{font-size:12.5px;color:#334155;margin-top:7px}
.card2 .mine{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.card2 .mine div{flex:1 1 110px;background:#f8fafc;border-radius:8px;padding:6px 9px}
.card2 .mine span{display:block;font-size:10.5px;color:#64748b}
.card2 .mine strong{font-size:14.5px;color:#0f3d5c}
/* ---------------- actions */
.steps{display:grid;gap:9px;margin-top:10px}
.step{display:flex;gap:10px;background:#fff;border-radius:11px;padding:11px 12px;
  box-shadow:0 3px 12px rgba(16,42,67,.08)}
.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:#0f3d5c;color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:13px}
.step .t{font-size:13px;color:#1f2937}
.step .t b{color:#0f3d5c}
.step .t small{display:block;color:#64748b;font-size:11.5px;margin-top:2px}
/* ---------------- progress / percentile */
.pstrip{position:relative;height:26px;background:#e8eef4;border-radius:6px;margin-top:14px;overflow:hidden}
.pstrip .fill{position:absolute;inset-block:0;inset-inline-start:0;background:#0e7490}
.pstrip .t4{position:absolute;inset-block:0;width:2px;background:#16a34a}
.pstrip .tg{position:absolute;inset-block:0;width:2px;background:#d97706}
.pstrip .lab{position:absolute;inset-block:0;display:flex;align-items:center;font-size:11px;
  font-weight:700;color:#0f3d5c;padding-inline-start:8px}
footer{margin-top:22px;font-size:11px;color:#94a3b8;text-align:center}
.sig{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:10px}
.sig img{width:130px;max-height:70px;object-fit:contain}
.sig .who{font-size:12px;font-weight:700;color:#0f3d5c}
.disc{background:#fff8e6;border-inline-start:4px solid #d97706;border-radius:8px;padding:9px 12px;
  font-size:11.5px;color:#475569;margin-top:10px}
@media (max-width:560px){.wrap{padding:10px 8px 40px}.hero h1{font-size:19px}
  .hero2 .big{font-size:34px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chart svg{min-width:520px}.chart .swipe{display:block}
  .crow{grid-template-columns:minmax(78px,104px) 62px minmax(48px,1fr) 70px;gap:6px}
  .gaprow{grid-template-columns:minmax(72px,102px) minmax(0,1fr) 62px}
  .trow{grid-template-columns:minmax(66px,92px) minmax(0,1fr) 58px}
  .dtbl table{min-width:470px}
  .hero .top{flex-direction:column;align-items:flex-start}
  .langs button{padding:5px 10px;font-size:12px}}
@media print{body{background:#fff}.chart,.panel,.card2,.step{break-inside:avoid}}
/* ---- comparison bars */
.cmp{margin-top:4px}
.crow{display:grid;grid-template-columns:minmax(96px,132px) 74px minmax(60px,1fr) 96px;
  gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #eef2f6}
.crow .cl{font-size:11.5px;color:#475569;font-weight:600}
.crow .cv{font-size:13px;font-weight:800;color:#0f3d5c;text-align:center;font-variant-numeric:tabular-nums}
.crow .cr{font-size:10.5px;color:#94a3b8;text-align:end;font-variant-numeric:tabular-nums}
.ctrack{position:relative;height:10px;background:#e8eef4;border-radius:5px}
.ctrack i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:5px}
.ctrack b{position:absolute;inset-block:-3px;width:2px;background:#0f3d5c}
/* ---- percentile strip */
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11px;color:#64748b}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
/* ---- landing CTA */
.dp-cta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;
  background:#0f3d5c;color:#fff;border-radius:12px;padding:12px 14px;margin-top:14px}
.dp-cta p{font-size:12.5px;margin:0;color:#dbe9f1}
.dp-cta a{background:#fff;color:#0f3d5c;text-decoration:none;font-weight:700;font-size:13px;
  padding:9px 14px;border-radius:999px;white-space:nowrap}
.dp-cta a:hover{background:#e6f2f6}
/* ---- misc used by JS */
.hero .eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.hero .ghost{min-height:34px;padding:5px 13px;font:600 12.5px inherit;cursor:pointer;
  border-radius:999px;border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff}
.cmp2{margin-top:8px;font-size:11.5px;color:#64748b}
.tbl{overflow-x:auto;background:#fff;border-radius:13px;box-shadow:0 3px 12px rgba(16,42,67,.08);margin-top:10px}
.tbl table{width:100%;border-collapse:collapse;font-size:11.5px;min-width:560px}
.tbl th{background:#0f3d5c;color:#fff;padding:8px 6px;font-weight:600;font-size:11px;text-align:center}
.tbl th:first-child{text-align:start}
.tbl td{padding:7px 6px;border-bottom:1px solid #e8eef4;text-align:center;font-variant-numeric:tabular-nums}
.tbl td.id{text-align:start;font:600 11px ui-monospace,monospace;color:#0f3d5c}
.tbl tr.focus{background:#eef6fb}
.tbl tr.focus td{font-weight:700}
.meTag{display:inline-block;margin-inline-start:6px;background:#0f3d5c;color:#fff;font-size:9.5px;
  font-weight:700;padding:1px 6px;border-radius:999px;vertical-align:middle}
.sign{display:flex;justify-content:flex-start;margin-top:18px}
.cap{font-size:11.5px;color:#64748b;margin-top:8px}
/* ---- new sections */
.gapbars{margin-top:6px}
.gaprow{display:grid;grid-template-columns:minmax(92px,128px) minmax(0,1fr) 78px;
  gap:8px;align-items:center;padding:6px 0}
.gaprow .gl{font-size:11.5px;color:#475569;font-weight:600;line-height:1.3}
.gaprow .gv{font-size:12.5px;font-weight:800;color:#0f3d5c;text-align:end;font-variant-numeric:tabular-nums}
.gaptrack{position:relative;height:14px;background:#eef2f6;border-radius:4px}
.gaptrack i{position:absolute;inset-block:0;border-radius:4px}
.gapbase{font-size:11px;color:#64748b;margin-top:6px}
/* band distribution */
.bands{display:flex;height:26px;border-radius:6px;overflow:hidden;margin-top:8px}
.bands div{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.bandlab{display:flex;flex-wrap:wrap;gap:12px;margin-top:7px;font-size:11px;color:#64748b}
.bandlab span{display:inline-flex;align-items:center;gap:5px}
.bandlab i{width:10px;height:10px;border-radius:2px}
/* daily table */
.dtbl{overflow-x:auto;background:#fff;border-radius:12px;box-shadow:0 3px 12px rgba(16,42,67,.08);margin-top:10px}
.dtbl table{width:100%;border-collapse:collapse;font-size:11px;min-width:520px}
.dtbl th{background:#0f3d5c;color:#fff;padding:7px 5px;font-size:10.5px;font-weight:600;text-align:center}
.dtbl td{padding:6px 5px;border-bottom:1px solid #eef2f6;text-align:center;font-variant-numeric:tabular-nums}
.dtbl td.b{text-align:start}
.pill2{display:inline-block;padding:1px 7px;border-radius:999px;font-size:9.5px;font-weight:800;color:#fff}
.pill2.r{background:#dc2626}.pill2.a{background:#d97706}.pill2.g{background:#16a34a}
/* trend rows */
.trow{display:grid;grid-template-columns:minmax(84px,110px) minmax(0,1fr) 66px;gap:8px;
  align-items:center;padding:8px 0;border-bottom:1px solid #eef2f6}
.trow .tl{font-size:11.5px;color:#475569;font-weight:600}
.trow .tv{font-size:13px;font-weight:800;color:#0f3d5c;text-align:end;font-variant-numeric:tabular-nums}
.ttrack{position:relative;height:12px;background:#eef2f6;border-radius:4px}
.ttrack i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:4px}
.ttrack b{position:absolute;inset-block:-3px;width:2px;background:#0f3d5c}
/* insight callout */
.callout{background:#0f3d5c;color:#fff;border-radius:12px;padding:13px 15px;margin-top:10px}
.callout b{font-size:15px;display:block;margin-bottom:3px}
.callout p{color:#dbe9f1;font-size:12.5px;margin:0}
.callout.warn{background:#8a3a12}
.callout.good{background:#14532d}
/* days legend */
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-top:10px}
.twocol div{background:#f8fafc;border-radius:9px;padding:8px 10px}
.twocol span{display:block;font-size:10.5px;color:#64748b}
.twocol strong{font-size:15px;color:#0f3d5c}

  function renderGate(error) {
    var g = document.getElementById('gate');
    var langs = ['en', 'bn', 'ur'].map(function (code) {
      var name = { en: 'English', bn: 'বাংলা', ur: 'اردو' }[code];
      return '<button type="button" data-lang="' + code + '" aria-pressed="' + (LANG === code ? 'true' : 'false') + '">' + name + '</button>';
    }).join('');
    g.innerHTML = '<div class="card">' +
      '<div class="langs">' + langs + '</div>' +
      '<h1>' + esc(t('gateTitle')) + '</h1>' +
      '<p>' + esc(t('gateSub')) + '</p>' +
      '<form id="gateForm" novalidate>' +
      '<label for="driverId">' + esc(t('gateLabel')) + '</label>' +
      '<input id="driverId" name="driverId" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="4 7 2 3 9 5 6" aria-describedby="gateErr">' +
      '<button type="submit">' + esc(t('gateButton')) + '</button>' +
      '<p class="err" id="gateErr" role="alert">' + (error ? esc(error) : '') + '</p>' +
      '<p class="hint">' + esc(t('gateHint')) + '</p>' +
      '</form></div>';
    g.querySelectorAll('[data-lang]').forEach(function (b) {
      b.addEventListener('click', function () { LANG = b.getAttribute('data-lang'); renderGate(error); });
    });
    g.querySelector('#gateForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var id = g.querySelector('#driverId').value.replace(/\D/g, '');
      if (!D.riders[id]) { renderGate(t('gateErr')); g.querySelector('#driverId').focus(); return; }
      ME = D.riders[id];
      try { localStorage.setItem('nemow-driver', id); } catch (err) {}
      render();
    });
    var input = g.querySelector('#driverId');
    if (!error) input.focus();
  }

  /* ----------------------------------------------------------- chart: bars */
  function dailyBars(daily) {
    var W = 720, H = 230, padL = 30, padB = 40, padT = 16;
    var pw = W - padL - 8, ph = H - padT - padB;
    var dates = Object.keys(daily).sort();
    var max = Math.max.apply(null, dates.map(function (d) { return daily[d].comp || 0; }).concat([15]));
    var vmax = max * 1.15;
    var bw = pw / dates.length;
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="daily deliveries">';
    [0, 5, 10, 15].forEach(function (gv) {
      if (gv > vmax) return;
      var y = padT + ph - gv / vmax * ph;
      s += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - 8) + '" y2="' + y.toFixed(1) + '" stroke="#dbe6ec"/>';
      s += '<text x="' + (padL - 6) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="10.5" fill="#64748b">' + gv + '</text>';
    });
    var ty = padT + ph - 15 / vmax * ph;
    s += '<line x1="' + padL + '" y1="' + ty.toFixed(1) + '" x2="' + (W - 8) + '" y2="' + ty.toFixed(1) + '" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/>';
    s += '<text x="' + (W - 10) + '" y="' + (ty - 5).toFixed(1) + '" text-anchor="end" font-size="10" fill="#b45309">15</text>';
    dates.forEach(function (d, i) {
      var v = daily[d].comp || 0;
      var bh = v / vmax * ph;
      var x = padL + i * bw + bw * 0.15;
      var col = v < 10 ? '#dc2626' : v < 13 ? '#d97706' : '#16a34a';
      s += '<rect x="' + x.toFixed(1) + '" y="' + (padT + ph - bh).toFixed(1) + '" width="' + (bw * 0.7).toFixed(1) + '" height="' + bh.toFixed(1) + '" fill="' + col + '" rx="2"/>';
      s += '<text x="' + (x + bw * 0.35).toFixed(1) + '" y="' + (padT + ph - bh - 4).toFixed(1) + '" text-anchor="middle" font-size="9.5" fill="#334155">' + v.toFixed(0) + '</text>';
      if (i % 2 === 0) s += '<text x="' + (x + bw * 0.35).toFixed(1) + '" y="' + (H - padB + 14) + '" text-anchor="middle" font-size="9.5" fill="#64748b">' + d.slice(-2) + '</text>';
    });
    return s + '</svg>';
  }

  /* ------------------------------------------------------- comparison rows */
  function compareRows(rows) {
    /* rows: [{label, value, ref, max, better:'high'|'low', fmt}] rendered as CSS bars */
    var out = '<div class="cmp">';
    rows.forEach(function (r) {
      var scale = r.max || Math.max(r.value || 0, r.ref || 0, 1);
      var pv = Math.max(0, Math.min(100, (r.value || 0) / scale * 100));
      var pr = Math.max(0, Math.min(100, (r.ref || 0) / scale * 100));
      var col = '#7c8f9c';
      if (r.value !== null && r.ref !== null) {
        var good = r.better === 'low' ? r.value <= r.ref : r.value >= r.ref;
        var mid = r.better === 'low'
          ? r.value <= r.ref * 1.08
          : r.value >= r.ref * 0.94;
        col = good ? '#16a34a' : mid ? '#d97706' : '#dc2626';
      }
      out += '<div class="crow"><span class="cl">' + esc(r.label) + '</span>' +
        '<span class="cv">' + (r.value === null ? t('missing') : r.fmt(r.value)) + '</span>' +
        '<div class="ctrack"><i style="width:' + pv.toFixed(2) + '%;background:' + col + '"></i>' +
        '<b style="inset-inline-start:calc(' + pr.toFixed(2) + '% - 1px)" title="' + esc(r.refLabel || '') + '"></b></div>' +
        '<span class="cr">' + esc(r.refLabel || '') + ' ' + (r.ref === null ? '' : r.fmt(r.ref)) + '</span></div>';
    });
    return out + '</div>';
  }

  function strip(mine, top, med, target) {
    var lo = 0.9, hi = 1.6;
    function x(v) { return Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100)); }
    return '<div class="pstrip"><span class="fill" style="width:' + x(mine).toFixed(2) + '%"></span>' +
      '<span class="t4" style="inset-inline-start:' + x(top).toFixed(2) + '%"></span>' +
      '<span class="tg" style="inset-inline-start:' + x(target).toFixed(2) + '%"></span>' +
      '<span class="lab" style="inset-inline-start:' + Math.min(64, x(mine) + 2).toFixed(2) + '%">' + ltr(f(mine, 3)) + '</span></div>' +
      '<div class="legend"><span><i style="background:#0e7490"></i>' + esc(t('stripMine')) + '</span>' +
      '<span><i style="background:#16a34a"></i>' + esc(t('stripTop')) + ' ' + ltr(f(top, 3)) + '</span>' +
      '<span><i style="background:#d97706"></i>' + esc(t('stripTarget')) + ' ' + ltr(f(target, 3)) + '</span>' +
      '<span><i style="background:#94a3b8"></i>' + esc(t('refFleet')) + ' ' + ltr(f(med, 3)) + '</span></div>';
  }

  function ladder(mine, their, target, hours) {
    var W = 720, H = 210, padL = 52, padR = 26, padT = 34, padB = 46;
    var pw = W - padL - padR, ph = H - padT - padB;
    var vmax = Math.max(mine, their, target) * 1.14;
    var vals = [
      [t('ladderToday'), mine, '#0f3d5c'],
      [t('ladderTheirPace'), their, '#0e7490'],
      [t('ladderTarget'), target, '#b45309']
    ];
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="ladder to target">';
    [0, 5, 10, 15].forEach(function (gv) {
      if (gv > vmax * 1.2) return;
      var y = padT + ph - gv / vmax * ph;
      s += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) + '" stroke="#dbe6ec"/>';
      s += '<text x="' + (padL - 6) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="10.5" fill="#64748b">' + gv + '</text>';
    });
    var bw = pw / 3 * 0.5;
    vals.forEach(function (v, i) {
      var cx = padL + pw * (i + 0.5) / 3;
      var bh = v[1] / vmax * ph;
      s += '<rect x="' + (cx - bw / 2).toFixed(1) + '" y="' + (padT + ph - bh).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" fill="' + v[2] + '" rx="3"/>';
      s += '<text x="' + cx.toFixed(1) + '" y="' + (padT + ph - bh - 7).toFixed(1) + '" text-anchor="middle" font-size="13" font-weight="800" fill="#0f3d5c">' + v[1].toFixed(2) + '</text>';
      s += '<text x="' + cx.toFixed(1) + '" y="' + (H - 24) + '" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">' + esc(v[0]) + '</text>';
    });
    return s + '</svg>';
  }

  /* ------------------------------------------------------- chart: gap split */
  function gapBars(me, top) {
    var H = me.hours_day;
    var hoursPart = (top.hours_day - H) * top.per_hour;
    var pacePart = H * (top.per_hour - me.per_hour);
    var parts = [
      [t('gapRest'), me.per_day, '#0f3d5c'],
      [t('gapHours'), hoursPart, '#d97706'],
      [t('gapPace'), pacePart, '#dc2626']
    ];
    var total = Math.max(0, parts[0][1]) + Math.max(0, parts[1][1]) + Math.max(0, parts[2][1]) || 1;
    var out = '<div class="gapbars">';
    parts.forEach(function (p) {
      var w = Math.max(0, p[1]) / total * 100;
      out += '<div class="gaprow"><span class="gl">' + esc(p[0]) + '</span>' +
        '<div class="gaptrack"><i style="width:' + w.toFixed(2) + '%;background:' + p[2] + '"></i></div>' +
        '<span class="gv">' + plus(p[1], 2) + '</span></div>';
    });
    out += '</div>';
    out += '<div class="gapbase">' + esc(t('gapTotal')) + ': <bdi dir="ltr">' + f(top.per_day, 2) + '</bdi> ' +
      '/day · ' + esc(t('gapRest')) + ': <bdi dir="ltr">' + f(me.per_day, 2) + '</bdi>/day</div>';
    if (hoursPart < 0) {
      out += '<div class="callout good" style="margin-top:10px"><b>' +
        t('hoursNotIt', { mine: '<bdi dir="ltr">' + f(me.hours_day, 2) + '</bdi>',
                          top: '<bdi dir="ltr">' + f(top.hours_day, 2) + '</bdi>' }) +
        '</b></div>';
    }
    return out;
  }

  function plus(v, d) {
    var s = (v >= 0 ? '+' : '\u2212') + Math.abs(v).toFixed(d === undefined ? 1 : d);
    return '<bdi dir="ltr">' + s + '</bdi>';
  }

  /* ----------------------------------------------- chart: fleet histogram */
  function histMinutes(mine, topMid) {
    var vals = (D.fleet.minutes_all || []).slice().sort(function (a, b) { return a - b; });
    var bins = [[0, 45], [45, 50], [50, 55], [55, 60], [60, 65], [65, 70], [70, 100]];
    var counts = bins.map(function (b) {
      return vals.filter(function (v) { return v >= b[0] && v < b[1]; }).length;
    });
    var W = 720, Hh = 210, padL = 30, padB = 46, padT = 18;
    var pw = W - padL - 10, ph = Hh - padT - padB;
    var vmax = Math.max.apply(null, counts.concat([1])) * 1.2;
    var bw = pw / bins.length;
    var meBin = bins.findIndex(function (b) { return mine >= b[0] && mine < b[1]; });
    var s = '<svg viewBox="0 0 ' + W + ' ' + Hh + '" role="img" aria-label="minutes per delivery across the fleet">';
    [0, 2, 4, 6, 8].forEach(function (gv, i) {
      if (gv > vmax) return;
      var y = padT + ph - gv / vmax * ph;
      s += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - 10) + '" y2="' + y.toFixed(1) + '" stroke="#dbe6ec"/>';
      s += '<text x="' + (padL - 6) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="10.5" fill="#64748b">' + gv + '</text>';
    });
    counts.forEach(function (c, i) {
      var bh = c / vmax * ph;
      var x = padL + i * bw + bw * 0.16;
      var col = i === meBin ? '#dc2626' : (bins[i][0] >= 45 && bins[i][0] <= 50 ? '#16a34a' : '#94a3b8');
      s += '<rect x="' + x.toFixed(1) + '" y="' + (padT + ph - bh).toFixed(1) + '" width="' + (bw * 0.68).toFixed(1) + '" height="' + Math.max(2, bh).toFixed(1) + '" fill="' + col + '" rx="2"/>';
      s += '<text x="' + (x + bw * 0.34).toFixed(1) + '" y="' + (padT + ph - bh - 5).toFixed(1) + '" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">' + c + '</text>';
      s += '<text x="' + (x + bw * 0.34).toFixed(1) + '" y="' + (Hh - padB + 15) + '" text-anchor="middle" font-size="9.5" fill="#64748b">' + bins[i][0] + '–' + (bins[i][1] === 100 ? '∞' : bins[i][1]) + '</text>';
    });
    return s + '</svg>';
  }

  /* -------------------------------------------------------------- sections */
  function buildExcuses(me) {
    var fl = D.fleet, top = D.top, cards = [];

    /* 1. shared car */
    var wo = me.with_overlap, no = me.without_overlap;
    var shared = fl.shared_car;
    var worseOnShared = wo.per_hour !== null && no.per_hour !== null && wo.per_hour < no.per_hour;
    var carVerdict = worseOnShared ? 'part' : 'no';
    cards.push({
      q: t('qCar'), verdict: carVerdict,
      body: t('evCar', {
        a: wo.days, b: ltr(f(wo.per_hour, 3)), c: no.days, d: ltr(f(no.per_hour, 3)),
        e: shared.riders, f: ltr(f(shared.per_hour, 3))
      }) + ' ' + (worseOnShared ? t('evCarLess', {
        g: f(Math.abs(no.per_hour - wo.per_hour), 3),
        h: f(Math.abs(no.per_hour - wo.per_hour) * me.hours_day, 1)
      }) : t('evCarMore')),
      mine: [[t('stripMine'), f(wo.per_hour, 3)], [t('refTop'), f(top.shared_car_per_hour, 3)]]
    });

    /* 2. late start */
    var lateCount = top.ids.filter(function (id) {
      var r = D.riders[id];
      return r && r.start !== null && r.start >= 14;
    }).length;
    var lateGap = fl.late.per_hour - fl.early.per_hour;
    cards.push({
      q: t('qLate'),
      verdict: Math.abs(lateGap) < 0.05 ? 'no' : (fl.late.per_hour > fl.early.per_hour ? 'no' : 'part'),
      body: t('evLate', { a: ltr(f(fl.late.per_hour, 3)), b: ltr(f(fl.early.per_hour, 3)), c: lateCount })
        + ' ' + t('evLateMine', { mine: ltr(hhmm(me.start)) }),
      mine: [[t('stripMine'), hhmm(me.start)], [t('refFleet'), ltr(f(fl.late.per_day, 1)) + ' / ' + ltr(f(fl.early.per_day, 1))]]
    });

    /* 3. fewer hours */
    var fewer = fl.fewer_hours, many = fl.many_hours;
    cards.push({
      q: t('qHours'),
      verdict: fewer.per_hour < many.per_hour * 0.9 ? 'part' : 'no',
      body: t('evHours', { a: ltr(f(fewer.per_hour, 3)), b: ltr(f(many.per_hour, 3)) }) + ' ' +
        t('evHoursTop', {
          top: ltr(f(top.hours_day, 1)), mine: ltr(f(me.hours_day, 1)),
          x: ltr(f(me.hours_day * me.per_hour, 1))
        }),
      mine: [[t('stripMine'), f(me.hours_day, 1) + ' h'], [t('refTop'), f(top.hours_day, 1) + ' h']]
    });

    /* 4. offer volume (dispatch) */
    var perDayOffer = me.notified / me.days;
    var topOffer = top.offers_day;
    var offerGap = topOffer - perDayOffer;
    cards.push({
      q: t('qOffers'),
      verdict: offerGap > 2 ? 'part' : 'no',
      body: offerGap > 2
        ? t('evOffersBad', { mine: ltr(f(perDayOffer, 2)), top: ltr(f(topOffer, 2)), a: ltr(f(me.accept_pct, 1)), at: ltr(f(top.accept_pct, 1)) })
        : t('evOffersGood', { mine: ltr(f(perDayOffer, 2)), top: ltr(f(topOffer, 2)) }) + ' ' +
          t('evOffers', { mine: ltr(f(perDayOffer, 2)), top: ltr(f(topOffer, 2)),
                          d: ltr(f(Math.max(0, offerGap), 2)),
                          a: ltr(f(me.accept_pct, 1)), at: ltr(f(top.accept_pct, 1)) }),
      mine: [[t('stripMine'), f(perDayOffer, 2) + ' / day'], [t('refTop'), f(topOffer, 2) + ' / day']]
    });

    /* 5. distance */
    var slope = fl.km_minutes_slope || 3.9, kmGap = (me.km_order || 0) - (top.km_order || 0);
    var kmCost = kmGap > 0 ? kmGap * slope : 0;
    cards.push({
      q: t('qDistance'),
      verdict: kmCost > 2.5 ? 'part' : 'no',
      body: t('evDistance', {
        mine: ltr(f(me.km_order, 2)), top: ltr(f(top.km_order, 2)),
        med: ltr(f(fl.med_km_order, 2)), slope: f(slope, 1)
      }) + ' ' + (kmCost > 2.5 ? t('evDistanceBig', { cost: f(kmCost, 1) }) : t('evDistanceSmall')),
      mine: [[t('stripMine'), f(me.km_order, 2) + ' km'], [t('refTop'), f(top.km_order, 2) + ' km']]
    });
    return cards;
  }

  function buildActions(me) {
    var top = D.top, steps = [];
    var needMinutes = D.target.minutes;
    steps.push({
      h: t('a1', { m: f(Math.max(0, me.minutes - needMinutes), 1) }),
      b: t('a1body', {
        mine: ltr(f(me.minutes, 1)), target: ltr(f(needMinutes, 1)),
        gap: ltr(f(Math.max(0, me.minutes - needMinutes), 1)),
        hours: ltr(f(me.hours_day, 1))
      })
    });
    if (me.accept_pct !== null && me.accept_pct < (top.accept_pct || 96)) {
      var perDayOffer = me.notified / me.days;
      var gain = perDayOffer * ((top.accept_pct - me.accept_pct) / 100);
      steps.push({
        h: t('a2'),
        b: t('a2body', {
          mine: ltr(f(me.accept_pct, 1)), top: ltr(f(top.accept_pct, 1)),
          n: ltr(f(me.declined, 0)), x: ltr(f(gain, 2))
        })
      });
    } else {
      steps.push({ h: t('a2'), b: t('a2good', { mine: ltr(f(me.accept_pct, 1)) }) });
    }
    if (me.stacked_day < (top.stacked_day || 0) * 0.9) {
      steps.push({
        h: t('a3'), b: t('a3body', {
          top: ltr(f(top.stacked_day, 2)), mine: ltr(f(me.stacked_day, 2))
        })
      });
    } else {
      steps.push({ h: t('a3'), b: t('a3good', { mine: ltr(f(me.stacked_day, 2)) }) });
    }
    if (me.mate) {
      steps.push({
        h: t('a4'), b: t('a4body', {
          a: ltr(f(me.with_overlap.per_hour, 3)) + ' / ' + ltr(f(me.without_overlap.per_hour, 3)),
          mate: ltr(me.mate)
        })
      });
    }
    if (me.km_order !== null && me.km_order > (top.km_order || 0) * 1.1) {
      steps.push({ h: t('a5'), b: t('a5body', { mine: ltr(f(me.km_order, 2)), top: ltr(f(top.km_order, 2)) }) });
    } else {
      steps.push({ h: t('a5'), b: t('a5good', { mine: ltr(f(me.km_order, 2)) }) });
    }
    return steps;
  }

  function rankOf(list, value) {
    if (!list || value === null || value === undefined) return null;
    var below = list.filter(function (x) { return x < value; }).length;
    return { below: below, total: list.length - 1 };
  }

  function render() {
    var me = ME, fl = D.fleet, top = D.top;
    document.body.classList.toggle('rtl', T[LANG].dir === 'rtl');
    document.documentElement.setAttribute('lang', { en: 'en', bn: 'bn', ur: 'ur' }[LANG]);
    document.documentElement.setAttribute('dir', T[LANG].dir);

    var achievements = me.per_day >= 15 ? 'good' : me.per_day >= 13 ? 'mid' : '';
    var langs = ['en', 'bn', 'ur'].map(function (code) {
      var name = { en: 'English', bn: 'বাংলা', ur: 'اردو' }[code];
      return '<button type="button" data-lang="' + code + '" aria-pressed="' + (LANG === code ? 'true' : 'false') + '">' + name + '</button>';
    }).join('');

    var kpis = [
      ['kPerDay', f(me.per_day, 2), t('hOutOf') + ' 15', '#b45309', 'a'],
      ['kPerHour', f(me.per_hour, 3), t('hTarget') + ' ' + f(D.target.per_hour, 3), '#dc2626', 'r'],
      ['kMinutes', f(me.minutes, 1) + ' min', t('hTarget') + ' ' + f(D.target.minutes, 1), '#dc2626', 'r'],
      ['kHours', f(me.hours_day, 2) + ' h', t('hFleet') + ' ' + f(fl.med_hours_day, 2), '#2563eb', 'b'],
      ['kExec', f(me.exec_pct, 1) + '%', t('hOf') + ' ' + f(me.planned, 1) + ' h', '#16a34a', 'g'],
      ['kAccept', f(me.accept_pct, 1) + '%', t('hTop') + ' ' + f(top.accept_pct, 1), me.accept_pct < 95 ? '#dc2626' : '#16a34a', me.accept_pct < 95 ? 'r' : 'g'],
      ['kStacked', f(me.stacked_day, 2), t('hTop') + ' ' + f(top.stacked_day, 2), me.stacked_day < top.stacked_day * 0.9 ? '#dc2626' : '#16a34a', me.stacked_day < top.stacked_day * 0.9 ? 'r' : 'g'],
      ['kLost', f(me.lost_pct, 2) + '%', f(me.lost, 2) + ' h', '#475569', ''],
      ['kKm', f(me.km_order, 2), t('hTop') + ' ' + f(top.km_order, 2), '#475569', ''],
      ['kDays', f(me.days, 0), '', '#475569', '']
    ].map(function (k) {
      return '<div class="tile ' + k[4] + '"><span>' + esc(t(k[0])) + '</span><strong style="color:' + k[3] + '">' +
        ltr(k[1]) + '</strong><small>' + esc(k[2]) + '</small></div>';
    }).join('');

    var excuses = buildExcuses(me).map(function (c) {
      var pill = c.verdict === 'no' ? t('verdictNo') : c.verdict === 'part' ? t('verdictPart') : t('verdictYes');
      var cls = c.verdict === 'no' ? 'no' : c.verdict === 'part' ? 'part' : '';
      return '<div class="card2"><div class="q">' + esc(c.q) + '</div>' +
        '<span class="v ' + cls + '">' + esc(pill) + '</span>' +
        '<div class="e">' + c.body + '</div>' +
        '<div class="mine">' + c.mine.map(function (m) {
          return '<div><span>' + esc(m[0]) + '</span><strong>' + ltr(m[1]) + '</strong></div>';
        }).join('') + '</div></div>';
    }).join('');

    var actions = buildActions(me).map(function (s, i) {
      return '<div class="step"><div class="n">' + (i + 1) + '</div><div class="t"><b>' + esc(s.h) + '</b><small>' + s.b + '</small></div></div>';
    }).join('');

    /* ---- gap decomposition ---- */
    var gapHtml = '<div class="chart">' + gapBars(me, top) +
      '<p class="cap">' + esc(t('gapNote')) + '</p></div>' +
      '<div class="callout"><b>' + esc(t('gapPaceShare', {
        g: f(top.per_day - me.per_day, 1),
        p: f(Math.max(0, me.hours_day * (top.per_hour - me.per_hour)), 1),
        h: f(Math.max(0, (top.hours_day - me.hours_day) * top.per_hour), 1)
      }).replace('<', '&lt;')) + '</b></div>';

    /* ---- percentile / rank ---- */
    var hrRank = rankOf(fl.per_hour_all, me.per_hour);
    var pctHtml = '<div class="panel"><p>' + (hrRank && hrRank.below >= hrRank.total / 2 ? t('pctBody' , {
      below: ltr(f(hrRank.below, 0)), total: ltr(f(hrRank.total, 0))
    }) : t('pctBodyLow', { below: ltr(f(hrRank ? hrRank.below : 0, 0)), total: ltr(f(hrRank ? hrRank.total : 0, 0)) })) + '</p></div>';

    /* ---- October -> November trend ---- */
    var trendHtml;
    if (me.october && me.october.per_hour) {
      var delta = me.per_hour - me.october.per_hour;
      var tscale = Math.max(1.6, me.per_hour * 1.15, me.october.per_hour * 1.15);
      trendHtml =
        '<div class="trow"><span class="tl">' + esc(t('trendOct')) + '</span>' +
        '<div class="ttrack"><i style="width:' + (me.october.per_hour / tscale * 100).toFixed(1) + '%;background:#94a3b8"></i></div>' +
        '<span class="tv">' + ltr(f(me.october.per_hour, 3)) + '</span></div>' +
        '<div class="trow"><span class="tl">' + esc(t('trendNov')) + '</span>' +
        '<div class="ttrack"><i style="width:' + (me.per_hour / tscale * 100).toFixed(1) + '%;background:' +
        (delta >= 0 ? '#16a34a' : '#dc2626') + '"></i></div>' +
        '<span class="tv">' + ltr(f(me.per_hour, 3)) + '</span></div>' +
        '<div class="trow"><span class="tl">' + esc(t('refTop')) + '</span>' +
        '<div class="ttrack"><i style="width:' + (top.per_hour / tscale * 100).toFixed(1) + '%;background:#0e7490"></i></div>' +
        '<span class="tv">' + ltr(f(top.per_hour, 3)) + '</span></div>' +
        '<div class="trow"><span class="tl">' + esc(t('refFleet')) + '</span>' +
        '<div class="ttrack"><i style="width:' + (fl.med_per_hour / tscale * 100).toFixed(1) + '%;background:#cbd5dd"></i></div>' +
        '<span class="tv">' + ltr(f(fl.med_per_hour, 3)) + '</span></div>' +
        '<p class="cap">' + esc(t('trendBodyShort')) + ' <bdi dir="ltr">' +
        (delta >= 0 ? '+' : '\u2212') + Math.abs(delta).toFixed(3) + '</bdi> ' + esc(t('perHourWord')) + '</p>';
    } else {
      trendHtml = '<div class="panel"><p>' + esc(t('trendNone')) + '</p></div>';
    }

    /* ---- band split of the 21 days ---- */
    var bandTot = me.days || 1;
    var bandHtml = '<div class="bands">' +
      (me.days_under_10 ? '<div style="flex:' + me.days_under_10 + ';background:#dc2626">' + me.days_under_10 + '</div>' : '') +
      (me.days_10_12 ? '<div style="flex:' + me.days_10_12 + ';background:#d97706">' + me.days_10_12 + '</div>' : '') +
      (me.days_13_plus ? '<div style="flex:' + me.days_13_plus + ';background:#16a34a">' + me.days_13_plus + '</div>' : '') +
      '</div><div class="bandlab">' +
      '<span><i style="background:#dc2626"></i>' + esc(t('bandUnder')) + ' · ' + me.days_under_10 + '</span>' +
      '<span><i style="background:#d97706"></i>' + esc(t('bandMid')) + ' · ' + me.days_10_12 + '</span>' +
      '<span><i style="background:#16a34a"></i>' + esc(t('bandGood')) + ' · ' + me.days_13_plus + '</span></div>' +
      '<div class="twocol">' +
      '<div><span>' + esc(t('daysUnder')) + '</span><strong>' + ltr(f(me.days_under_10, 0)) + '</strong></div>' +
      '<div><span>' + esc(t('daysMid')) + '</span><strong>' + ltr(f(me.days_10_12, 0)) + '</strong></div>' +
      '<div><span>' + esc(t('daysGood')) + '</span><strong>' + ltr(f(me.days_13_plus, 0)) + '</strong></div>' +
      '<div><span>' + esc(t('daysHit')) + '</span><strong>' + ltr(f(me.days_at_target, 0)) + '</strong></div>' +
      '<div><span>' + esc(t('bestDay')) + '</span><strong>' + ltr(f(me.best_day, 0)) + '</strong></div>' +
      '<div><span>' + esc(t('worstDay')) + '</span><strong>' + ltr(f(me.worst_day, 0)) + '</strong></div>' +
      '</div>';

    /* best vs worst day, same car */
    var days = Object.keys(me.daily).sort();
    var best = days.reduce(function (a, d) { return (me.daily[d].comp > me.daily[a].comp) ? d : a; }, days[0]);
    var worst = days.reduce(function (a, d) { return (me.daily[d].comp < me.daily[a].comp) ? d : a; }, days[0]);
    var bd = me.daily[best], wd = me.daily[worst];
    var bmin = bd.act && bd.comp ? 60 * bd.act / bd.comp : null;
    var wmin = wd.act && wd.comp ? 60 * wd.act / wd.comp : null;

    /* daily table with the two rows highlighted */
    var dayRows = days.map(function (d) {
      var r = me.daily[d];
      var m = r.act && r.comp ? 60 * r.act / r.comp : null;
      var cls = r.comp < 10 ? 'r' : r.comp < 13 ? 'a' : 'g';
      var hi = (d === best) ? ' style="background:#eef6fb"' : (d === worst) ? ' style="background:#fdf2f2"' : '';
      return '<tr' + hi + '><td class="b">' + d.slice(-2) + '</td><td><b>' + r.comp.toFixed(0) + '</b></td>' +
        '<td>' + (r.comp >= 15 ? '+' : '') + (r.comp - 15).toFixed(0) + '</td>' +
        '<td>' + (r.act !== null && r.act !== undefined ? r.act.toFixed(2) : '—') + '</td>' +
        '<td>' + (m !== null ? m.toFixed(1) : '—') + '</td>' +
        '<td>' + (r.accepted !== undefined && r.notified !== undefined ? r.accepted.toFixed(0) + '/' + r.notified.toFixed(0) : '—') + '</td>' +
        '<td>' + (r.stacked !== undefined ? r.stacked.toFixed(0) : '—') + '</td>' +
        '<td><span class="pill2 ' + cls + '">' + (cls === 'r' ? '&lt;10' : cls === 'a' ? '10-12' : '13+') + '</span></td></tr>';
    }).join('');

    var cmp = compareRows([
      { label: t('tPerHour'), value: me.per_hour, ref: top.per_hour, max: 1.7, better: 'high', fmt: function (v) { return f(v, 3); }, refLabel: t('refTop') },
      { label: t('tMinutes'), value: me.minutes, ref: top.minutes, max: 100, better: 'low', fmt: function (v) { return f(v, 1); }, refLabel: t('refTop') },
      { label: t('tPerDay'), value: me.per_day, ref: top.per_day, max: 18, better: 'high', fmt: function (v) { return f(v, 2); }, refLabel: t('refTop') },
      { label: t('tAccept'), value: me.accept_pct, ref: top.accept_pct, max: 100, better: 'high', fmt: function (v) { return f(v, 1) + '%'; }, refLabel: t('refTop') },
      { label: t('tStacked'), value: me.stacked_day, ref: top.stacked_day, max: 0.8, better: 'high', fmt: function (v) { return f(v, 2); }, refLabel: t('refTop') },
      { label: t('tKm'), value: me.km_order, ref: top.km_order, max: 9, better: 'low', fmt: function (v) { return f(v, 2); }, refLabel: t('refTop') }
    ]);

    var tableRows = [[me, true]].concat(top.ids.map(function (id) { return [D.riders[id], false]; }));
    var table = tableRows.map(function (pair) {
      var r = pair[0], isMe = pair[1];
      return '<tr' + (isMe ? ' class="focus"' : '') + '><td class="id">' + ltr(r.id) + (isMe ? '<span class="meTag">' + esc(t('youRow')) + '</span>' : '') + '</td>' +
        '<td>' + ltr(f(r.per_day, 2)) + '</td><td>' + ltr(f(r.per_hour, 3)) + '</td><td>' + ltr(f(r.minutes, 1)) + '</td>' +
        '<td>' + ltr(f(r.accept_pct, 1)) + '%</td><td>' + ltr(f(r.stacked_day, 2)) + '</td><td>' + ltr(f(r.km_order, 2)) + '</td></tr>';
    }).join('');

    var theirPaceDay = me.hours_day * top.per_hour;

    var html = '' +
      '<header class="hero"><div class="top"><div><div class="eyebrow">NEMOW · ' + esc(t('gateTitle')) + '</div>' +
      '<h1>' + esc(t('greeting')) + '</h1></div><span class="id">' + ltr(me.id) + '</span></div>' +
      '<p class="say">' + esc(t('allChat')) + '</p>' +
      '<div class="meta"><span>' + esc(t('period')) + '</span><span>' + esc(t('targetPill')) + '</span>' +
      '<span>' + esc(t('daysPill', { days: me.days })) + '</span><span>' + esc(t('fleetPill', { n: fl.riders })) + '</span></div>' +
      '<div class="langs">' + langs + '<button type="button" id="switch" class="ghost">' + esc(t('changeId')) + '</button></div></header>' +

      '<h2><span class="n">01</span>' + esc(t('s1')) + '</h2>' +
      '<div class="hero2 ' + achievements + '"><div class="big">' + ltr(f(me.per_hour, 3)) + ' <small>' + esc(t('headlineMain')) + '</small></div>' +
      '<p class="cap">' + esc(t('headlineSub')) + '</p>' +
      strip(me.per_hour, top.per_hour, fl.med_per_hour, D.target.per_hour) +
      '<div class="cmp2"><div><span>' + esc(t('stripNote', { t: f(D.target.per_hour, 3), top: f(top.per_hour, 3), med: f(fl.med_per_hour, 3) })) + '</span></div></div></div>' +
      '<div class="tiles">' + kpis + '</div>' +

      '<h2><span class="n">02</span>' + esc(t('s2b')) + '</h2>' +
      gapHtml +
      pctHtml +

      '<h2><span class="n">03</span>' + esc(t('s3b')) + '</h2>' +
      trendHtml +
      '<div class="panel" style="margin-top:10px"><p><b>' + esc(t('bandTitle')) + '</b></p>' + bandHtml + '</div>' +
      '<div class="callout warn"><b>' + esc(t('bestDay')) + ': ' + ltr(f(bd.comp, 0)) + ' / ' + ltr(f(bd.act, 2)) + ' h' +
      ' · ' + esc(t('worstDay')) + ': ' + ltr(f(wd.comp, 0)) + ' / ' + ltr(f(wd.act, 2)) + ' h</b>' +
      '<p>' + esc(t('bestNote', {
        c: f(bd.comp, 0), h: f(bd.act, 1), m: f(bmin, 1),
        c2: f(wd.comp, 0), h2: f(wd.act, 1), m2: f(wmin, 1),
        d: f(Math.abs(wmin - bmin), 1)
      })) + '</p><p style="margin-top:6px"><b>' + esc(t('compareFlag')) + '</b></p></div>' +
      '<div class="dtbl"><table><thead><tr><th>' + esc(t('tableDay')) + '</th><th>' + esc(t('tableComp')) + '</th><th>' +
      esc(t('tableVs')) + '</th><th>' + esc(t('tableHours')) + '</th><th>' + esc(t('tableMin')) + '</th><th>' +
      esc(t('tableAcc')) + '</th><th>' + esc(t('tableStack')) + '</th><th>' + esc(t('tableBand')) + '</th></tr></thead>' +
      '<tbody>' + dayRows + '</tbody></table></div>' +

      '<h2><span class="n">04</span>' + esc(t('s4b')) + '</h2>' +
      '<div class="claim">' + excuses + '</div>' +

      '<h2><span class="n">05</span>' + esc(t('s5b')) + '</h2>' +
      '<div class="steps">' + actions + '</div>' +
      '<div class="callout good"><b>' + esc(t('weekly')) + '</b>' +
      '<p>' + t('weeklyBody', {
        a: ltr(f(me.hours_day * top.per_hour, 0)), h: ltr(f(me.hours_day, 1)),
        r: ltr(f(top.per_hour, 3)), m: ltr(f(60 / top.per_hour, 1))
      }) + '</p></div>' +
      '<div class="panel" style="margin-top:10px"><p><b>' + esc(t('checkTitle')) + '</b><br>' +
      t('checkBody', { m: ltr(f(D.target.minutes, 1)), a: ltr(f(top.accept_pct, 0)), h: ltr(f(D.target.per_hour, 3)) }) + '</p></div>' +

      '<h2><span class="n">06</span>' + esc(t('s6b')) + '</h2>' +
      '<div class="chart"><span class="swipe">Swipe sideways</span>' + cmp +
      '<p class="cap">' + esc(t('plotNote')) + '</p></div>' +
      '<div class="chart"><span class="swipe">Swipe sideways</span>' + ladder(me.per_day, theirPaceDay, 15, me.hours_day) +
      '<p class="cap">' + t('ladderBody', { hours: '<bdi dir="ltr">' + f(me.hours_day, 1) + '</bdi>' }) + '</p></div>' +

      '<h2><span class="n">07</span>' + esc(t('histTitle')) + '</h2>' +
      '<div class="chart"><span class="swipe">Swipe sideways</span>' + histMinutes(me.minutes, top.minutes) +
      '<p class="cap">' + esc(t('histNote')) + '</p></div>' +

      '<h2><span class="n">08</span>' + esc(t('dailyTitle')) + '</h2>' +
      '<div class="chart"><span class="swipe">Swipe sideways</span>' + dailyBars(me.daily) +
      '<p class="cap">' + esc(t('dailyNote')) + '</p></div>' +

      '<h2><span class="n">09</span>' + esc(t('s8b')) + '</h2>' +
      '<div class="tbl"><table><thead><tr><th>' + esc(t('tDriver')) + '</th><th>' + esc(t('tPerDay')) + '</th><th>' +
      esc(t('tPerHour')) + '</th><th>' + esc(t('tMinutes')) + '</th><th>' + esc(t('tAccept')) + '</th><th>' +
      esc(t('tStacked')) + '</th><th>' + esc(t('tKm')) + '</th></tr></thead><tbody>' + table + '</tbody></table></div>' +
      '<p class="cap">' + esc(t('tableTitle')) + ' · ' + top.ids.map(function (i) { return ltr(i); }).join(' · ') + '</p>' +

      '<div class="sign"><div class="sig"><img src="' + document.getElementById('sigSrc').src + '" alt="">' +
      '<div class="who">' + esc(t('sigWho')) + '</div></div></div>' +
      '<p class="disc">' + esc(t('footerNote')) + '</p>' +
      '<footer>Nemow Logistics · ' + esc(t('period')) + '</footer>';

    document.getElementById('app').innerHTML = html;
    document.getElementById('gate').hidden = true;

    document.querySelectorAll('.langs [data-lang]').forEach(function (b) {
      b.addEventListener('click', function () { LANG = b.getAttribute('data-lang'); render(); window.scrollTo(0, 0); });
    });
    document.getElementById('switch').addEventListener('click', function () {
      ME = null;
      document.getElementById('gate').hidden = false;
      renderGate('');
    });
  }

  /* ------------------------------------------------------------------ boot */
  var stored = null;
  try { stored = localStorage.getItem('nemow-driver'); } catch (e) {}
  if (stored && D.riders[stored]) { ME = D.riders[stored]; render(); }
  else renderGate('');
})();
</script>
</body></html>
